apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: legacy-ingress
spec: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
spec:
  hostNetwork: true
  containers:
    - name: app
      image: ghcr.io/example/app:latest
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_ADMIN"]
  volumes:
    - name: host-root
      hostPath:
        path: /
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: too-broad
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
